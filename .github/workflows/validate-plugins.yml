name: Validate plugins

on:
  pull_request:
    paths:
      - "marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "**/.zcode-plugin/**"
      - "**/.claude-plugin/**"
      - "**/hooks.json"
      - "**/.mcp.json"
      - "**/SKILL.md"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs
